<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>H5 Payment Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="checkout-card">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div>
          <div class="brand-name">Payment</div>
          <div class="brand-sub">Secure Checkout</div>
        </div>
      </div>

      <div class="amount-box">
        <div class="label">应支付金额</div>
        <div class="amount"><span>$</span><strong id="amount">34.20</strong></div>
      </div>

      <div class="section-title">选择支付方式</div>

      <div class="methods" id="methods">
        <button class="method selected" data-method="Alipay">
          <span class="icon alipay">支</span>
          <span class="method-info"><b>支付宝支付</b><small>Alipay</small></span>
          <span class="radio"></span>
        </button>

        <button class="method" data-method="ABA PAY">
          <span class="icon aba">ABA</span>
          <span class="method-info"><b>ABA PAY</b><small>Cambodia</small></span>
          <span class="radio"></span>
        </button>

        <button class="method" data-method="Pi Pay">
          <span class="icon pipay">P</span>
          <span class="method-info"><b>Pi Pay</b><small>Cambodia</small></span>
          <span class="radio"></span>
        </button>

        <button class="method" data-method="eMoney">
          <span class="icon emoney">e</span>
          <span class="method-info"><b>eMoney</b><small>Wallet</small></span>
          <span class="radio"></span>
        </button>
      </div>

      <button class="pay-btn" id="payBtn">去支付</button>
      <div class="security">🔒 Demo checkout · 本页面仅用于测试UI流程</div>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <div class="success">✓</div>
      <h2>模拟支付成功</h2>
      <p id="resultText"></p>
      <button id="closeBtn">返回订单</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
